{% extends 'rango/base.html' %}

{% block title_block %}
    Change password
{% endblock %}

{% block body_block %}
<h1>Change your password...</h1>

<form method="post" action=".">
    {% csrf_token %}

    {{ form.as_p }}

    <input type="submit" value="Change password" />
    <input type="hidden" name="next" value="{{ next }}" />
</form>

{% endblock %}
